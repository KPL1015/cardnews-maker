<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cardnews Maker</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="intro">
        <p class="eyebrow">SNU OFF THE FIELD · CARD NEWS MAKER</p>
        <h1>여러 장의 카드뉴스를<br />한 번에 만들어보세요</h1>
        <p class="intro-copy">카드를 추가해 페이지처럼 편집하고, 완성본은 하나의 ZIP 파일로 저장하세요.</p>
      </section>
      <section class="workspace" aria-label="카드뉴스 편집기">
        <aside class="card-panel">
          <div class="panel-heading"><span class="step">01</span><h2>카드 목록</h2></div>
          <div id="cardList" class="card-list" aria-label="카드 선택 목록"></div>
          <button id="addCardButton" class="secondary-button" type="button">+ 새 카드 추가</button>
          <p class="panel-note">카드를 선택하면 해당 카드만 편집됩니다.</p>
        </aside>
        <section class="controls" aria-label="선택한 카드 편집">
          <div class="panel-heading"><span class="step">02</span><h2>카드 편집</h2></div>
          <label class="upload-box" for="imageInput"><input id="imageInput" type="file" accept="image/*" /><span class="upload-icon">↑</span><span><strong>배경 이미지 업로드</strong><small>JPG, PNG, WEBP 파일을 선택하세요</small></span></label>
          <p id="fileName" class="file-name" aria-live="polite">아직 선택한 이미지가 없습니다.</p>
          <label for="titleInput">제목</label>
          <textarea id="titleInput" maxlength="90" rows="3" placeholder="제목을 입력하세요"></textarea>
          <label for="bodyInput">본문</label>
          <textarea id="bodyInput" maxlength="240" rows="5" placeholder="본문을 입력하세요"></textarea>
          <p class="hint">Enter를 눌러 원하는 위치에서 줄바꿈할 수 있습니다.</p>
          <div class="position-controls" aria-label="텍스트 위치 조절">
            <div class="position-heading"><span>텍스트 위치</span><small>사진 속 인물을 피해 조절하세요</small></div>
            <label for="titlePosition">제목 상하 <output id="titlePositionValue"></output></label><input id="titlePosition" class="range" type="range" min="150" max="690" />
            <label for="titleHorizontal">제목 좌우 <output id="titleHorizontalValue"></output></label><input id="titleHorizontal" class="range" type="range" min="40" max="420" />
            <label for="bodyPosition">본문 상하 <output id="bodyPositionValue"></output></label><input id="bodyPosition" class="range" type="range" min="500" max="900" />
            <label for="bodyHorizontal">본문 좌우 <output id="bodyHorizontalValue"></output></label><input id="bodyHorizontal" class="range" type="range" min="40" max="650" />
            <label for="photoHorizontal">사진 좌우 <output id="photoHorizontalValue"></output></label><input id="photoHorizontal" class="range" type="range" min="0" max="100" />
            <label for="photoVertical">사진 상하 <output id="photoVerticalValue"></output></label><input id="photoVertical" class="range" type="range" min="0" max="100" />
          </div>
          <button id="removeCardButton" class="text-button" type="button">현재 카드 삭제</button>
        </section>
        <section class="preview-area">
          <div class="preview-heading"><span class="step">03</span><h2>미리보기</h2><span id="cardCounter" class="size"></span></div>
          <div class="canvas-frame"><canvas id="cardCanvas" width="1080" height="1080" aria-label="카드뉴스 미리보기"></canvas></div>
          <div class="download-actions"><button id="downloadCurrentButton" class="secondary-button" type="button">현재 카드 PNG 저장</button><button id="downloadAllButton" type="button">전체 카드 PNG 저장 <span>↓</span></button></div>
          <p class="download-note">모든 카드는 한 개의 ZIP 파일 안에 PNG로 저장됩니다.</p>
        </section>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
